[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "firmware-color-studio"
version = "0.2.0"
description = "Firmware-derived and JPEG chart-matched camera profiles with offline RAW previews"
requires-python = ">=3.12"
dependencies = ["numpy==1.26.4", "PySide6==6.8.3", "rawpy==0.28.0"]
license = "MIT"
authors = [{name = "Yunhyok"}]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller==6.21.0", "pypdf>=6,<7", "unicorn==2.1.4"]

[project.gui-scripts]
firmware-color-studio = "firmware_color_studio.app:main"

[project.scripts]
fcs = "firmware_color_studio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
firmware_color_studio = ["data/**/*", "resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

