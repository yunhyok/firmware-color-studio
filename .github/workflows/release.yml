name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the package version from main and create its tag
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install -e '.[dev]'
      - name: Test and build installer
        shell: pwsh
        run: ./tools/build_windows.ps1
      - name: Check bundled application
        shell: pwsh
        run: |
          $process = Start-Process -FilePath './dist/FirmwareColorStudio/FirmwareColorStudio.exe' -ArgumentList 'verify --report dist/frozen-check.json' -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Frozen application failed' }
          $result = Get-Content dist/frozen-check.json | ConvertFrom-Json
          if ($result.status -ne 'passed') { throw 'Invalid frozen report' }
          $env:FCS_FROZEN_EXE = (Resolve-Path './dist/FirmwareColorStudio/FirmwareColorStudio.exe').Path
          & ./.venv/Scripts/python -m pytest -q tests/test_cli.py::test_chart_fit_automatically_detects_classic_jpeg
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*-setup.exe
            dist/SHA256SUMS.txt
            dist/frozen-check.json
      - name: Publish release
        # A pushed v* tag, or a manual run on main with "release" checked.
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = & .\.venv\Scripts\python -c 'from firmware_color_studio import __version__; print(__version__)'
          $tag = "v$version"
          if ('${{ github.ref_type }}' -eq 'tag') {
            if ('${{ github.ref_name }}' -ne $tag) { throw "Tag ${{ github.ref_name }} does not match package version $version" }
            gh release create $tag dist/*-setup.exe dist/SHA256SUMS.txt dist/frozen-check.json --verify-tag --title "Firmware Color Studio $tag" --notes-file "docs/releases/$tag.md"
          } else {
            # The tag must not exist yet: gh creates it at this commit together with the release.
            git ls-remote --exit-code --tags origin "refs/tags/$tag"
            if ($LASTEXITCODE -eq 0) { throw "Tag $tag already exists; push the tag or bump the version instead" }
            gh release create $tag dist/*-setup.exe dist/SHA256SUMS.txt dist/frozen-check.json --target '${{ github.sha }}' --title "Firmware Color Studio $tag" --notes-file "docs/releases/$tag.md"
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release was not published' }

